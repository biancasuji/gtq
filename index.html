<script>
document.querySelectorAll('#toolChips .chip').forEach(chip=>{
  chip.addEventListener('click', ()=> chip.classList.toggle('active'));
});

function val(id, fallback){
  const v = document.getElementById(id).value.trim();
  return v || fallback;
}

function selectedTools(){
  const chips = [...document.querySelectorAll('#toolChips .chip.active')]
    .map(c=>c.dataset.tool);
  return chips.length ? chips.join('·') : 'Photoshop·Illustrator';
}

function toggleCustomField(type){
  const select = document.getElementById(type);
  const custom = document.getElementById(type + 'Custom');

  custom.style.display =
    select.value === '직접입력' ? 'block' : 'none';

  if(select.value !== '직접입력'){
    custom.value = '';
  }
}

function selectedOrCustom(type, fallback){
  const select = document.getElementById(type);

  if(select.value === '직접입력'){
    const custom =
      document.getElementById(type + 'Custom').value.trim();

    return custom || fallback;
  }

  return select.value || fallback;
}

/* =========================
   onclick="copyText('draft1', this)"
========================= */

function copyText(id, btn){

  const text =
    document.getElementById(id).textContent;

  navigator.clipboard
    .writeText(text)
    .then(()=>{

      btn.textContent = '복사됨!';

      setTimeout(()=>{
        btn.textContent = '복사';
      },1500);

    });
}
